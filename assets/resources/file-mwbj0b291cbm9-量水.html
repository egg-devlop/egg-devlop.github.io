<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鸡蛋站小游戏 | 破解量水之术</title>
  <link rel="stylesheet" href="https://static.zxxk.com/h5/static/fa0f62d19e05416af4737fc51f270be6.css">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #ffffff, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .objective {
            font-size: 1.4rem;
            max-width: 700px;
            margin: 0 auto 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .objective i {
            margin-right: 8px;
            color: #4fc3f7;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .cups-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .cups-wrapper {
            display: flex;
            justify-content: space-around;
            position: relative;
            align-items: flex-end;
            height: 340px;
            width: 100%;
        }
        
        .cup {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 180px;
        }
        
        .cup-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            text-align: center;
        }
        
        .cup-display {
            width: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 0 30px 30px;
            position: relative;
            overflow: hidden;
        }
        
        #cup1-display {
            height: 300px;
        }
        
        #cup2-display {
            height: 180px;
        }
        
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #2196f3, #64b5f6);
            transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .water-level {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 15px 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }
        
        .controls {
            flex: 1;
            min-width: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #81d4fa;
        }
        
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }
        
        .action-btn {
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2196f3, #0d47a1);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #42a5f5, #1565c0);
        }
        
        .action-btn:active {
            transform: translateY(1px);
        }
        
        .action-btn i {
            font-size: 1.5rem;
        }
        
        .utility-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        .util-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .util-btn.undo {
            background: linear-gradient(135deg, #ff9800, #ef6c00);
            color: white;
        }
        
        .util-btn.reset {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
        }
        
        .util-btn.hint {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
        }
        
        .history {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .history-list {
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .history-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
        }
        
        .step-number {
            font-weight: bold;
            margin-right: 12px;
            color: #4fc3f7;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            font-size: 1.4rem;
            margin: 15px 0;
            border-radius: 12px;
        }
        
        .status.playing {
            background: rgba(76, 175, 80, 0.2);
            color: #a5d6a7;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.3);
            color: #69f0ae;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        .water-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }
        
        .water-info-item {
            text-align: center;
            padding: 10px;
        }
        
        .water-info-value {
            font-size: 2rem;
            font-weight: bold;
            color: #64b5f6;
        }
        
        .water-info-label {
            font-size: 1.1rem;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .cups-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 40px;
                height: auto;
            }
            
            .action-btn, .util-btn {
                font-size: 1rem;
                padding: 14px;
            }
            
            #cup1-display {
                height: 250px;
            }
            
            #cup2-display {
                height: 150px;
            }
            
            .water-info {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

 <body>
  <div class="container">
   <header>
    <h1><i class="fas fa-water"></i> 破解量水之术</h1>
    <div class="objective">
     <i class="fas fa-bullseye"></i> 你有一个5升杯和一个3升杯（杯壁无刻度），请通过倒水、倒空或互换杯中的水，使任一量杯中恰好有4升水
    </div>
   </header>
   <div id="status" class="status playing">
    <i class="fas fa-play-circle"></i> 正在挑战中... 当前步数: <span id="stepCount">0</span>
   </div>
   <div class="game-area">
    <div class="cups-container">
     <div class="cups-wrapper">
      <div class="cup">
       <div class="cup-name">
        5升量杯
       </div>
       <div id="cup1-display" class="cup-display">
        <div id="water1" class="water" style="height: 0%;">
         <div class="water-level" id="level1">
          0升
         </div>
        </div>
       </div>
      </div>
      <div class="cup">
       <div class="cup-name">
        3升量杯
       </div>
       <div id="cup2-display" class="cup-display">
        <div id="water2" class="water" style="height: 0%;">
         <div class="water-level" id="level2">
          0升
         </div>
        </div>
       </div>
      </div>
     </div>
     <div class="water-info">
      <div class="water-info-item">
       <div class="water-info-value" id="cup1-value">
        0升
       </div>
       <div class="water-info-label">
        5升杯水量
       </div>
      </div>
      <div class="water-info-item">
       <div class="water-info-value" id="cup2-value">
        0升
       </div>
       <div class="water-info-label">
        3升杯水量
       </div>
      </div>
      <div class="water-info-item">
       <div class="water-info-value" id="total-value">
        0升
       </div>
       <div class="water-info-label">
        总水量
       </div>
      </div>
     </div>
    </div>
    <div class="controls">
     <h2 class="section-title"><i class="fas fa-tools"></i> 操作控制</h2>
     <div class="actions-grid">
      <button class="action-btn" onclick="fillCup(0)"> <i class="fas fa-faucet"></i> 加满5升杯 </button> <button class="action-btn" onclick="fillCup(1)"> <i class="fas fa-faucet"></i> 加满3升杯 </button> <button class="action-btn" onclick="emptyCup(0)"> <i class="fas fa-trash"></i> 倒空5升杯 </button> <button class="action-btn" onclick="emptyCup(1)"> <i class="fas fa-trash"></i> 倒空3升杯 </button> <button class="action-btn" onclick="pourWater(0, 1)"> <i class="fas fa-exchange-alt"></i> 5→3 倒水 </button> <button class="action-btn" onclick="pourWater(1, 0)"> <i class="fas fa-exchange-alt"></i> 3→5 倒水 </button>
     </div>
     <div class="utility-buttons">
      <button class="util-btn undo" onclick="undoAction()"> <i class="fas fa-undo"></i> 撤销 </button> <button class="util-btn reset" onclick="resetGame()"> <i class="fas fa-sync-alt"></i> 重置 </button> <button class="util-btn hint" onclick="showHint()"> <i class="fas fa-lightbulb"></i> 提示 </button>
     </div>
    </div>
   </div>
   <div class="history">
    <h2 class="section-title"><i class="fas fa-history"></i> 操作记录</h2>
    <div id="historyList" class="history-list">
     <div class="history-item">
      <span class="step-number">初始状态:<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAAjCAIAAAAfYW1yAAAAhklEQVR42u1SQQ7AIAjj/49ul51kIAjzSmPMpqa0FOELqH37a771CYUNYLskulClDocSv8PXFHIVdK9Z0IKkFy0jiwInzUx6wVoLfZxLBS4WdaiMqzEVaFWwrL8xWtGk0BsxyotJ0ydyTKdthBV38ks/zFyw1ouwgKTjUILwGkMxFEMxFFU8/Db8aw+yiRUAAAAASUVORK5CYII=" style="position: absolute; left: -99999px; top: -99999px; opacity: 0; pointer-events: none; width: 1px; height: 1px;"></span> 两个量杯均为空
     </div>
    </div>
   </div>
  </div>
  <footer>
   <p>鸡蛋站小游戏 © 2026 | 通过操作量杯得到4升水 | 经典逻辑谜题</p>
  </footer>
  <script>
        // 游戏状态
        const gameState = {
            cups: [0, 0],         // 两个量杯的当前水量
            capacities: [5, 3],   // 量杯容量
            history: [{action: "初始状态", state: [0, 0]}],
            steps: 0,
            solved: false
        };
        
        // 更新UI显示
        function updateDisplay() {
            // 更新水量显示
            const cupDisplays = [document.getElementById('water1'), document.getElementById('water2')];
            const levelDisplays = [document.getElementById('level1'), document.getElementById('level2')];
            
            for (let i = 0; i < 2; i++) {
                // 根据百分比计算水位高度
                const heightPercentage = (gameState.cups[i] / gameState.capacities[i]) * 100;
                cupDisplays[i].style.height = `${heightPercentage}%`;
                levelDisplays[i].textContent = `${gameState.cups[i]}升`;
            }
            
            // 更新水量信息
            document.getElementById('cup1-value').textContent = `${gameState.cups[0]}升`;
            document.getElementById('cup2-value').textContent = `${gameState.cups[1]}升`;
            document.getElementById('total-value').textContent = `${gameState.cups[0] + gameState.cups[1]}升`;
            
            // 更新步数显示
            document.getElementById('stepCount').textContent = gameState.steps;
            
            // 更新操作记录
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            gameState.history.forEach((record, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                let statusText = `${record.state[0]}升, ${record.state[1]}升`;
                if (index === 0) {
                    historyItem.innerHTML = `<span class="step-number">初始状态:</span> ${statusText}`;
                } else {
                    historyItem.innerHTML = `<span class="step-number">步骤 ${index}:</span> ${record.action} → ${statusText}`;
                }
                
                historyList.appendChild(historyItem);
            });
            
            // 自动滚动到最新记录
            historyList.scrollTop = historyList.scrollHeight;
            
            // 检查胜利条件
            checkWinCondition();
        }
        
        // 加满量杯
        function fillCup(cupIndex) {
            if (gameState.solved) return;
            
            const capacity = gameState.capacities[cupIndex];
            const prevState = [...gameState.cups];
            
            gameState.cups[cupIndex] = capacity;
            gameState.steps++;
            
            recordAction(`加满${capacity}升杯`, prevState);
        }
        
        // 倒空量杯
        function emptyCup(cupIndex) {
            if (gameState.solved) return;
            
            const capacity = gameState.capacities[cupIndex];
            const prevState = [...gameState.cups];
            
            gameState.cups[cupIndex] = 0;
            gameState.steps++;
            
            recordAction(`倒空${capacity}升杯`, prevState);
        }
        
        // 倒水操作
        function pourWater(fromIndex, toIndex) {
            if (gameState.solved) return;
            
            const prevState = [...gameState.cups];
            const fromCup = gameState.cups[fromIndex];
            const toCapacity = gameState.capacities[toIndex];
            const toCup = gameState.cups[toIndex];
            
            const availableSpace = toCapacity - toCup;
            const transferAmount = Math.min(fromCup, availableSpace);
            
            if (transferAmount > 0) {
                gameState.cups[fromIndex] -= transferAmount;
                gameState.cups[toIndex] += transferAmount;
                gameState.steps++;
                
                recordAction(
                    `${gameState.capacities[fromIndex]}升杯→${gameState.capacities[toIndex]}升杯`, 
                    prevState
                );
            }
        }
        
        // 记录操作历史
        function recordAction(action, prevState) {
            gameState.history.push({
                action,
                state: [...gameState.cups]
            });
            updateDisplay();
        }
        
        // 撤销操作
        function undoAction() {
            if (gameState.history.length > 1) {
                gameState.history.pop();
                const prevState = gameState.history[gameState.history.length - 1].state;
                gameState.cups = [...prevState];
                gameState.steps--;
                
                // 如果已经胜利，取消胜利状态
                const statusElement = document.getElementById('status');
                statusElement.className = 'status playing';
                statusElement.innerHTML = '<i class="fas fa-play-circle"></i> 正在挑战中... 当前步数: <span id="stepCount">' + gameState.steps + '</span>';
                gameState.solved = false;
                
                updateDisplay();
            }
        }
        
        // 重置游戏
        function resetGame() {
            gameState.cups = [0, 0];
            gameState.steps = 0;
            gameState.history = [{action: "初始状态", state: [0, 0]}];
            
            const statusElement = document.getElementById('status');
            statusElement.className = 'status playing';
            statusElement.innerHTML = '<i class="fas fa-play-circle"></i> 正在挑战中... 当前步数: <span id="stepCount">0</span>';
            gameState.solved = false;
            
            updateDisplay();
            alert('重置完成了捏~(￣▽￣)~*')
        }
        
        // 检查胜利条件
        function checkWinCondition() {
            if (gameState.cups.includes(4)) {
                const statusElement = document.getElementById('status');
                statusElement.className = 'status success';
                statusElement.innerHTML = '<i class="fas fa-trophy"></i> 恭喜！您成功量出了4升水！';
                gameState.solved = true;
            }
        }
        
        // 显示提示
        function showHint() {
            alert('提示：以下是一种可能的解法：\n\n1. 加满5升杯 (5, 0)\n2. 将5升杯中的水倒入3升杯 (2, 3)\n3. 倒空3升杯 (2, 0)\n4. 将5升杯的水倒入3升杯 (0, 2)\n5. 加满5升杯 (5, 2)\n6. 将5升杯的水倒入3升杯（装满它） (4, 3)\n\n这样5升杯中就剩下了4升水！');
        }
        
        // 初始化游戏
        window.onload = updateDisplay;
    </script>
 </body>
</html>
